<div class="panel panel-default">
  <div class="panel panel-heading">
    <h3 class="panel-title">
      <span ng-if="!currentCfg.next" trspan="currentConfiguration"/>
      <span ng-if="currentCfg.next" trspan="loadedConfiguration"/>
    </h3>
  </div>
  <div class="panel panel-body">
    <dl class="dl-horizontal">
     <dt><span trspan="number"></span> :&nbsp;</dt>
     <dd>
       <span id="cfgnum" comment="{{translateP('__newCfgAvailable__')}}" ng-class="{'label':currentCfg.next,'label-warning':currentCfg.next}">{{currentCfg.cfgNum}}</span>
     </dd>
     <dt><span trspan="author"></span> :&nbsp;</dt><dd>{{currentCfg.cfgAuthor}}</dd>
     <dt><span trspan="authorIPAddress"></span> :&nbsp;</dt><dd>{{currentCfg.cfgAuthorIP}}</dd>
     <dt><span trspan="date"></span> :&nbsp;</dt><dd>{{currentCfg.date}}</dd>
     <dt><span trspan="cfgLog"></span> :&nbsp;</dt><dd>{{currentCfg.cfgLog}}</dd>
    </dl>
  </div>
</div>
<script type="text/javascript">
buttons=[{
  "title": "downloadIt",
  "action": function(c,$scope){window.open($scope.confPrefix+$scope.currentCfg.cfgNum+'?full');}
},{
  "title": "restore"
}];
</script>
