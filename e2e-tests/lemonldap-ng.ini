[all]

logLevel = debug

[configuration]

type=File
dirName=__pwd__/e2e-tests/conf
localStorage=Cache::FileCache
localStorageOptions={                             \
    'namespace'          => 'lemonldap-ng-config',\
    'default_expires_in' => 600,                  \
    'directory_umask'    => '007',                \
    'cache_root'         => '__pwd__/e2e-tests/conf',               \
    'cache_depth'        => 0,                    \
}

[portal]

notification = 0
checkXSS = 0
portalSkin = pastel

[handler]

https = 0
;port = 8080
status = 0
useRedirectOnError = 0

[manager]

protection   = manager
logLevel     = error
staticPrefix = /static
languages    = fr, en
templateDir  = __pwd__/lemonldap-ng-manager/site/templates

[apply]

