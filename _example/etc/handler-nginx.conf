server {
  listen __PORT__;
  server_name reload.__DNSDOMAIN__;
  root /var/www/html;

  location = /reload {
    allow 127.0.0.1;
    deny all;
    include /etc/nginx/fastcgi_params;
    fastcgi_pass __PSGISERVERSOCKET__;
  }

  # Client requests
  location / {
    deny all;
  }

  # Uncomment this if status is enabled
  #location = /lmstatus {
  #  allow 127.0.0.1;
  #  deny all;
  #  include /etc/nginx/fastcgi_params;
  #  fastcgi_pass __PSGISERVERSOCKET__;
  #}

}

