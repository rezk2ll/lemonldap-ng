include __DIR__/handler/lmH-apache2.conf
PerlOptions +GlobalRequest
#Listen 127.0.0.2:80
<VirtualHost 127.0.0.2:*>
    ServerName auth.example.com

    # DocumentRoot
    DocumentRoot __DIR__/portal
    <Directory __DIR__/portal>
	Order allow,deny
	Allow from all
	Options +ExecCGI
    </Directory>

    # Portal and Manager must be interpreted by Perl
    <Files *.pl>
	SetHandler perl-script
	PerlResponseHandler ModPerl::Registry
    </Files>

    <IfModule mod_dir.c>
	DirectoryIndex index.pl index.html
    </IfModule>

</VirtualHost>
#Listen 127.0.0.4:80
<VirtualHost 127.0.0.4:*>
    ServerName manager.example.com

    # DocumentRoot
    DocumentRoot __DIR__/manager
    <Directory __DIR__/manager>
	Order deny,allow
	Deny from all
	Allow from 127.0.0.0/8
	Options +ExecCGI
    </Directory>

    # Portal and Manager must be interpreted by Perl
    <Files *.pl>
	SetHandler perl-script
	PerlResponseHandler ModPerl::Registry
    </Files>

    <IfModule mod_dir.c>
	DirectoryIndex index.pl index.html
    </IfModule>

</VirtualHost>
