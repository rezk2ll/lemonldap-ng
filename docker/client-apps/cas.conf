<VirtualHost *:3000>

        #################################
        # Standard Apache configuration #
        #################################

        # Assuming this mod_auth_openidc client FQDN is: cas-client-<index>.llng.localhost
	ServerName cas-client-<index>.llng.localhost

	DocumentRoot /var/www/protected/cas/

	LogLevel debug

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

        #####################
        # CAS configuration #
        #####################
	CASCookiePath /var/cache/apache2/mod_auth_cas/
	CASLoginURL http://auth.llng.localhost:8080/cas/login
	CASValidateURL http://auth.llng.localhost:8080/cas/serviceValidate

	# This defines a directory where mod_auth_cas should do access control.
	<Location />
		# These are standard Apache apache configuration directives.
		# You must have enabled Apache's authn_core and authz_user modules.
		# See http://httpd.apache.org/docs/2.4/mod/mod_authn_core.html and
		# http://httpd.apache.org/docs/2.4/mod/mod_authz_user.html
		# about them.
		Require valid-user
		AuthType "CAS"
	</Location>
</VirtualHost>
