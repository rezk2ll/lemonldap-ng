<VirtualHost *:3000>

        #################################
        # Standard Apache configuration #
        #################################

	ServerName oidc-client-<index>.llng.localhost

	DocumentRoot /var/www/protected/oidc/

	LogLevel debug

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

        ######################
        # OIDC configuration #
        ######################


        # loading oidc module for apache
	# This line is commented-out as the module is enabled through a2enmod at image creation time
	# LoadModule auth_openidc_module modules/mod_auth_openidc.so

        # define OIDC provider configuration (metadata) Every endpoint URL is retrieved from this URL
        # adapt FQDN to match OIDC provider
	OIDCProviderMetadataURL http://auth.llng.localhost:8080/.well-known/openid-configuration

        # define client ID and secret for this client (should match the ones defined in OIDC provider)
	OIDCClientID modauthopenidc-client-<index>
	OIDCClientSecret modauthopenidc-clientsecret

	# OIDCRedirectURI is a vanity URL that must point to a path protected by this module but must NOT point to any content
	OIDCRedirectURI http://oidc-client-<index>.llng.localhost:3000/oidcredirecturi

        # Logout URL would be of the form:
        # http://oidc-client-<index>.localhost/oidcredirecturi?logout=https%3A%2F%2Foidc-client-<index>.localhost%2F
        # the logout value being the URL-encoded URL to be redirected after logout.
        # the logout value must be an unprotected page, to be declared as an "allowed logout redirect uri" in the OIDC provider

        # Explicit declaration of OIDC Provider logout URL
        OIDCProviderEndSessionEndpoint http://auth.llng.localhost:8080/oauth2/logout

        # configure a random password in OIDCCryptoPassphrase for session/state encryption purposes
	OIDCCryptoPassphrase secret

        # Allowed claims
        # These claims are automatically set as HTTP headers by mod_auth_openidc
        OIDCWhiteListedClaims authorizations email name preferred_username groups

        # Add prefix "OIDC_CLAIM_" before claims name
        OIDCClaimPrefix "OIDC_CLAIM_"

        #OIDCPassClaimsAs headers base64url
        OIDCPassUserInfoAs json

        # define which scopes are retrieved agentdata is the specific scope containing every Auth-* claim
        OIDCScope "openid email profile membership"

        # location where authentication to the OIDC provider is required
	<Location />
	   AuthType openid-connect
	   Require valid-user
	</Location>


</VirtualHost>
