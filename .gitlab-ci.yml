.build_job:
  stage: build
  retry: 1
  artifacts:
    expire_in: 1 hour
    paths:
      - result/*
  except:
    variables:
      - $SONARJOB == "1"

.debian_build_job:
  extends: .build_job
  script:
    - scripts/ci-build-deb
  before_script:
    - env | grep ^CI_
    # Converting to native package...
    - sed -i "1{s/-1) /$suffix) /}" debian/changelog
    - sed -i "1{s/-2) /$suffix) /}" debian/changelog
    - sed -i 's/3.0 (quilt)/3.0 (native)/' debian/source/format

stages:
  - build
  - deploy

before_script:
  - env | grep ^CI_

build_bullseye:
  extends: .debian_build_job
  image: debian:bullseye
  after_script:
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/debian/bullseye/*_all.deb

build_bookworm:
  extends: .debian_build_job
  image: debian:bookworm
  after_script:
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/debian/bookworm/*_all.deb

build_trixie:
  extends: .debian_build_job
  image: debian:trixie
  after_script:
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/debian/trixie/*_all.deb

build_focal:
  extends: .debian_build_job
  image: ubuntu:focal
  after_script:
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/ubuntu/focal/*_all.deb

build_jammy:
  extends: .debian_build_job
  image: ubuntu:jammy
  after_script:
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/ubuntu/jammy/*_all.deb

build_noble:
  extends: .debian_build_job
  image: ubuntu:noble
  after_script:
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/ubuntu/noble/*_all.deb

build_rocky_8:
  extends: .build_job
  image: quay.io/rockylinux/rockylinux:8
  script:
    - scripts/ci-build-rpm
    - dnf -y install ${CI_PROJECT_DIR}/result/rocky/8/*.noarch.rpm

build_rocky_9:
  extends: .build_job
  image: quay.io/rockylinux/rockylinux:9
  script:
    - scripts/ci-build-rpm
    - dnf -y install ${CI_PROJECT_DIR}/result/rocky/9/*.noarch.rpm

sonar-inspect:
  image: debian:bookworm
  stage: build
  script:
    - scripts/sonar
  artifacts:
    expire_in: 1 hour
    paths:
      - lemonldap-ng-*/cover_db/sonar_generic.xml
      - lemonldap-ng-*/perlcritic_report.txt
  only:
    variables:
      - $SONARJOB == "1"

sonar-upload:
  stage: deploy
  image: sonarsource/sonar-scanner-cli
  script:
    - /usr/bin/entrypoint.sh
  only:
    variables:
      - $SONARJOB == "1"
