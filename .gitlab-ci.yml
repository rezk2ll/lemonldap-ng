.build_job: &job_build
  stage: build
  script:
     - apt-get update && apt-get -y dist-upgrade
     - ci-build-pkg
  artifacts:
    expire_in: 1 hour
    paths:
      - result/*


stages:
- build
- sign
- deploy

before_script:
  - env | grep ^CI_
  # Converting to native package...
  - sed -i "1{s/-1) /$suffix) /}" debian/changelog
  - sed -i "1{s/-2) /$suffix) /}" debian/changelog
  - sed -i 's/3.0 (quilt)/3.0 (native)/' debian/source/format

build_stretch:
  image: buildpkg/debian:stretch
  <<: *job_build

build_buster:
  image: buildpkg/debian:buster
  <<: *job_build

#build_xenial:
#  image: buildpkg/ubuntu:xenial
#  <<: *job_build

build_bionic:
  image: buildpkg/ubuntu:bionic
  <<: *job_build

build_centos_7:
  image: buildpkg/centos:7
  stage: build
  script:
     - rm -f /etc/yum.repos.d/CentOS-Sources.repo
     - yum -y install epel-release
     - make rpm-dist
     - ci-build-pkg
  artifacts:
     expire_in: 1 day
     paths:
       - result/*

build_centos_8:
  image: buildpkg/centos:8
  stage: build
  script:
     - yum-config-manager --enable PowerTools
     - yum-config-manager --enable AppStream
     - yum -y install epel-release
     - make rpm-dist
     - ci-build-pkg
  artifacts:
     expire_in: 1 day
     paths:
       - result/*

sign:
  image: buildpkg/debian:stretch
  stage: sign
#  variables:
#    SIGN_USER: firstname.lastname@orange.com
#    GPG_PRIVATE_KEY:
  script:
    - cd $CI_PROJECT_DIR
    - ci-sign-pkg
  dependencies:
    - build_stretch
    - build_buster
#    - build_xenial
    - build_bionic
    - build_centos_7
#    - build_centos_8
  artifacts:
    expire_in: 1 day
    paths:
      - result/*
  only:
    - master

pages:
  image: buildpkg/debian:stretch
  stage: deploy
  variables:
    # Default page dir
    # PAGES_DIR: public
    PAGES_HOST: ow2.io
  environment:
    name: PPA
    url: http://${CI_PROJECT_NAMESPACE}.${PAGES_HOST}/${CI_PROJECT_NAME}
  script:
    - cd $CI_PROJECT_DIR
    - ci-pages-ppa
    - ci-pages-home
    - ci-pages-tree
  dependencies:
    - sign
  artifacts:
    expire_in: 1 day
    paths:
      - public
  only:
    - master

