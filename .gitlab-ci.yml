.build_job:
  stage: build
  retry: 1
  artifacts:
    expire_in: 1 hour
    paths:
      - result/*
  except:
    variables:
      - $SONARJOB == "1"

.debian_build_job:
  extends: .build_job
  image: debian:${CODENAME}
  variables:
    DISTRO: debian
  script:
    - scripts/ci-build-deb
    - DEBIAN_FRONTEND=noninteractive apt install -y ${CI_PROJECT_DIR}/result/${DISTRO}/${CODENAME}/*_all.deb
  before_script:
    - env | grep ^CI_
    # Converting to native package...
    - sed -i "1{s/-1) /$suffix) /}" debian/changelog
    - sed -i "1{s/-2) /$suffix) /}" debian/changelog
    - sed -i 's/3.0 (quilt)/3.0 (native)/' debian/source/format

.ubuntu_build_job:
  extends: .debian_build_job
  variables:
    DISTRO: ubuntu
  image: ubuntu:${CODENAME}

.rocky_build_job:
  extends: .build_job
  image: quay.io/rockylinux/rockylinux:${MAJOR}
  script:
    - scripts/ci-build-rpm
    - dnf -y install ${CI_PROJECT_DIR}/result/rocky/${MAJOR}/*.noarch.rpm

stages:
  - build
  - deploy

before_script:
  - env | grep ^CI_

# EOLTS: 2026-08-31
build_bullseye:
  extends: .debian_build_job
  variables:
    CODENAME: bullseye

# EOLTS: 2028-06-30
build_bookworm:
  extends: .debian_build_job
  variables:
    CODENAME: bookworm

# EOLTS: 2030-06-30
build_trixie:
  extends: .debian_build_job
  variables:
    CODENAME: trixie

# EOL: May 2025
build_focal:
  extends: .ubuntu_build_job
  variables:
    CODENAME: focal

# EOL: Apr 2027
build_jammy:
  extends: .ubuntu_build_job
  variables:
    CODENAME: jammy

# EOL: Apr 2029
build_noble:
  extends: .ubuntu_build_job
  variables:
    CODENAME: noble

# EOL: 31 May 2029
build_rocky_8:
  extends: .rocky_build_job
  variables:
    MAJOR: 8

# EOL: 31 May 2032
build_rocky_9:
  extends: .rocky_build_job
  variables:
    MAJOR: 9

sonar-inspect:
  image: debian:bookworm
  stage: build
  script:
    - scripts/sonar
  artifacts:
    expire_in: 1 hour
    paths:
      - lemonldap-ng-*/cover_db/sonar_generic.xml
      - lemonldap-ng-*/perlcritic_report.txt
  only:
    variables:
      - $SONARJOB == "1"

sonar-upload:
  stage: deploy
  image: sonarsource/sonar-scanner-cli
  script:
    - /usr/bin/entrypoint.sh
  only:
    variables:
      - $SONARJOB == "1"
